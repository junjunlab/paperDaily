name: Publish release

# 打 tag 就发版：git tag v1.0.0 && git push origin v1.0.0
# 复用 build.yml 构建两端，再把产物挂到 Release 上。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # gh release 需要在本仓库里跑（要读 tag / 提交信息），少了这步会报 not a git repository
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Check files
        run: ls -lh dist

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ### 下载

          | 文件 | 平台 | 说明 |
          |---|---|---|
          | `PaperDaily.apk` | Android 7.0+ | 直接安装。首次安装需允许「安装未知来源应用」 |
          | `PaperDaily-unsigned.ipa` | iOS | **未签名**，需自签后才能装（Sideloadly / AltStore，免费 Apple ID 签名 7 天有效） |

          不想点附件的话，固定下载地址：

          - APK：<https://github.com/junjunlab/paperDaily/releases/latest/download/PaperDaily.apk>
          - IPA：<https://github.com/junjunlab/paperDaily/releases/latest/download/PaperDaily-unsigned.ipa>

          ### 说明

          - APK 用 Expo 模板自带的 debug keystore 签名，自用没问题；上架应用商店请换成自己的 keystore。
          - iOS 未签名是因为签名需要 Apple 开发者账号的证书和 provisioning profile，无法放进公开仓库。要出可直接安装的 ipa，用 EAS Build（见 README）。
          - 本次构建对应 tag `__TAG__`。
          EOF

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          sed -i "s/__TAG__/${TAG}/g" notes.md
          FILES="dist/PaperDaily.apk dist/PaperDaily-unsigned.ipa"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 重跑同一个 tag：覆盖附件，别报「已存在」
            gh release upload "$TAG" $FILES --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes-file notes.md --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" $FILES \
              --title "一日一论文 · PaperDaily ${TAG}" \
              --notes-file notes.md \
              --repo "$GITHUB_REPOSITORY" \
              --latest
          fi
